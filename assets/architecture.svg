<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <style>
    .box { fill:#f3f4f6; stroke:#111827; stroke-width:2 }
    .label { font: 16px sans-serif; fill:#111827 }
  </style>
  <rect x="50" y="50" width="220" height="120" class="box" />
  <text x="160" y="115" class="label" text-anchor="middle">Foundation Model Adapter</text>

  <rect x="290" y="50" width="220" height="120" class="box" />
  <text x="400" y="115" class="label" text-anchor="middle">Memory Layer</text>

  <rect x="530" y="50" width="220" height="120" class="box" />
  <text x="640" y="115" class="label" text-anchor="middle">Runtime & Orchestration</text>

  <line x1="270" y1="110" x2="290" y2="110" stroke="#111827" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="510" y1="110" x2="530" y2="110" stroke="#111827" stroke-width="2" marker-end="url(#arrow)" />

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#111827" />
    </marker>
  </defs>

  <text x="400" y="200" class="label" text-anchor="middle">Persistent storage, retrieval, and indexed memory</text>
  <text x="400" y="225" class="label" text-anchor="middle">Governance, task orchestration, and action execution</text>
</svg>
